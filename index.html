<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webmail Town of Ashland, NH</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 20%, rgba(10, 55, 120, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(10, 55, 120, 0.04) 0%, transparent 50%);
        }

        /* ----- main card ----- */
        .card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 2.5rem 2rem 2.2rem;
            transition: box-shadow 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
        }

        .card:hover {
            box-shadow: 0 28px 72px rgba(0, 20, 40, 0.16);
        }

        /* ----- header / seal ----- */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .seal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .seal-icon {
            font-size: 2.2rem;
            color: #1a3a6b;
            background: #f0f4fc;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d6e2f2;
            flex-shrink: 0;
        }

        .seal-text {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b2a4a;
            line-height: 1.2;
        }

        .seal-text small {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #4d6a8f;
            letter-spacing: 0.02em;
            margin-top: 0.1rem;
        }

        .subhead {
            font-size: 0.95rem;
            color: #3d5a7a;
            background: #f2f6fd;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            border: 1px solid #dfe8f5;
            backdrop-filter: blur(2px);
            margin-top: 0.5rem;
        }

        /* ----- form ----- */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 0.35rem;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f7faff;
            border: 1.5px solid #dae3f0;
            border-radius: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #1a5a9e;
            box-shadow: 0 0 0 4px rgba(26, 90, 158, 0.12);
            background: #ffffff;
        }

        .input-wrapper i {
            padding: 0 0 0 1rem;
            font-size: 1rem;
            color: #6b85a6;
            width: 2.6rem;
            text-align: center;
            flex-shrink: 0;
            transition: color 0.2s;
        }

        .input-wrapper:focus-within i {
            color: #1a5a9e;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 0.2rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 450;
            color: #0b1e33;
            outline: none;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #98adc9;
            font-weight: 400;
            font-size: 0.95rem;
        }

        /* ----- password toggle ----- */
        .toggle-pw {
            background: none;
            border: none;
            padding: 0 1rem 0 0.25rem;
            color: #7b94b7;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .toggle-pw:hover {
            color: #1a3a6b;
        }

        /* ----- options row ----- */
        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            margin: 0.5rem 0 1.5rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #1e3a5f;
            cursor: pointer;
        }

        .remember input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #1a5a9e;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.9rem;
            color: #1a5a9e;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }

        .forgot-link:hover {
            color: #0d3b6b;
            border-bottom-color: #0d3b6b;
        }

        /* ----- login button ----- */
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: #0b2a4a;
            color: #ffffff;
            border: none;
            border-radius: 1.5rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(11, 42, 74, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .login-btn i {
            font-size: 1rem;
            opacity: 0.9;
        }

        .login-btn:hover {
            background: #143d66;
            box-shadow: 0 6px 18px rgba(11, 42, 74, 0.32);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* ----- footer / meta ----- */
        .footer-meta {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #627ca0;
            border-top: 1px solid #e4ebf6;
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .footer-meta .gov-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
            color: #3d5a7a;
            font-weight: 500;
        }

        .footer-meta .gov-badge i {
            font-size: 0.9rem;
        }

        .footer-meta .links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .footer-meta .links a {
            color: #4d6f94;
            text-decoration: none;
            font-weight: 450;
            transition: color 0.2s;
            border-bottom: 1px solid transparent;
        }

        .footer-meta .links a:hover {
            color: #0b2a4a;
            border-bottom-color: #0b2a4a;
        }

        .version {
            font-size: 0.7rem;
            color: #8aa2c2;
            letter-spacing: 0.03em;
            margin-top: 0.2rem;
        }

        /* ----- responsive fine-tune ----- */
        @media (max-width: 480px) {
            .card {
                padding: 1.75rem 1.25rem;
                border-radius: 1.5rem;
            }

            .seal-icon {
                width: 52px;
                height: 52px;
                font-size: 1.8rem;
            }

            .seal-text {
                font-size: 1.25rem;
            }

            .subhead {
                font-size: 0.8rem;
                padding: 0.2rem 1rem;
            }

            .input-wrapper input {
                padding: 0.75rem 0.75rem 0.75rem 0.1rem;
                font-size: 0.95rem;
            }

            .login-btn {
                font-size: 0.95rem;
                padding: 0.8rem;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
            }

            .footer-meta .links {
                gap: 0.8rem;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 380px) {
            .seal {
                flex-direction: column;
                gap: 0.3rem;
            }

            .seal-text {
                font-size: 1.1rem;
            }

            .seal-text small {
                font-size: 0.75rem;
            }
        }

        /* ----- subtle animation ----- */
        .card {
            animation: fadeUp 0.6s ease-out both;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* accessibility focus */
        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #1a5a9e;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-label="Webmail login">

        <!-- header -->
        <div class="header">
            <div class="seal">
                <div class="seal-icon" aria-hidden="true">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="seal-text">
                    Webmail
                    <small>Town of Ashland, NH</small>
                </div>
            </div>
            <div class="subhead">
                <i class="fas fa-lock" style="margin-right: 0.4rem; opacity:0.7;"></i>
                Secure Employee Portal
            </div>
        </div>

        <!-- login form -->
        <form id="loginForm" action="#" method="POST" autocomplete="on">
            <!-- username -->
            <div class="form-group">
                <label for="username"><i class="fas fa-user" style="margin-right:0.4rem; color:#4d6f94;"></i>Username or Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" id="username" name="username"
                    placeholder="employee@ashland.nh.gov"
                    value=""
                    aria-describedby="usernameHelp"
                    autofocus
                    required />
                </div>
                <div id="usernameHelp" style="font-size:0.75rem; color:#6b85a6; margin-top:0.25rem; padding-left:0.25rem;">
                    Use your town-issued credentials
                </div>
            </div>

            <!-- password -->
            <div class="form-group">
                <label for="password"><i class="fas fa-key" style="margin-right:0.4rem; color:#4d6f94;"></i>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password" />
                    <button type="button" class="toggle-pw" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fas fa-eye" id="pwIcon"></i>
                    </button>
                </div>
            </div>

            <!-- options -->
            <div class="options">
                <label class="remember">
                    <input type="checkbox" name="remember" checked />
                    <span>Keep me signed in</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- submit -->
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
            </button>
        </form>

        <!-- footer -->
        <div class="footer-meta">
            <div class="gov-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Official Town of Ashland · .gov</span>
            </div>
            <div class="links">
                <a href="#"><i class="fas fa-phone-alt" style="margin-right:0.3rem;"></i>IT Support</a>
                <a href="#"><i class="fas fa-question-circle" style="margin-right:0.3rem;"></i>Help</a>
                <a href="#"><i class="fas fa-file-alt" style="margin-right:0.3rem;"></i>Acceptable Use</a>
            </div>
            <div class="version">
                <i class="far fa-clock" style="margin-right:0.3rem;"></i>
                Secure Webmail v3.2 · Ashland, NH
            </div>
        </div>

    </div>

    <!-- toggle password visibility -->
    <script>
        (function() {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const pwIcon = document.getElementById('pwIcon');

            if (toggleBtn && passwordInput && pwIcon) {
                toggleBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    pwIcon.classList.toggle('fa-eye');
                    pwIcon.classList.toggle('fa-eye-slash');
                });
            }

            // simple form handler (demo)
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const username = document.getElementById('username')?.value || '';
                    const password = document.getElementById('password')?.value || '';

                    // just a lightweight demo feedback
                    if (username.trim() === '' || password.trim() === '') {
                        alert('Please fill in both username and password.');
                        return;
                    }

                    // show a friendly message (demo only)
                    alert('🔐  Demo login successful (no data sent).\n\nUsername: ' + username +
                        '\nThis is a static landing page for webmail.ashland.nh.gov.');
                });
            }
        })();
    </script>

</body>
</html>
